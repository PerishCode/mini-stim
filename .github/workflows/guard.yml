name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install flavor
        run: |
          curl -fsSL https://flavor.perish.uk/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/flavor" --version

      - name: Install sidecar
        run: |
          curl -fsSL https://sidecar.perish.uk/manage.sh | sh -s -- install --channel stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sidecar" --version

      - name: Initialize hooks
        run: python3 scripts/init.py

      - name: Repo guard
        run: |
          flavor check --root . --config flavor.toml
          python3 -m py_compile scripts/init.py
          python3 scripts/init.py --check
          hooks=$(git rev-parse --git-path hooks)
          sh -n "$hooks/pre-commit"
          sh -n "$hooks/commit-msg"

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_MODEL: ci-placeholder
          OPENAI_RESPONSES_BASE_URL: https://api.openai.com/v1
          SANTI_HOST: 127.0.0.1
          SANTI_DB: .tmp/ci.sqlite
          SANTI_PORT: 43307
        run: |
          mkdir -p .tmp
          cargo run -p mini-stim-server-soma -- serve &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:43307/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Generate contracts
        env:
          SANTI_API_URL: http://127.0.0.1:43307
        run: |
          curl -fsS "$SANTI_API_URL/api/openapi.json" -o packages/contracts/openapi.json
          python3 -m json.tool --indent 2 packages/contracts/openapi.json packages/contracts/openapi.json.tmp
          mv packages/contracts/openapi.json.tmp packages/contracts/openapi.json
          pnpm -C packages/contracts codegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
