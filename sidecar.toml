[project]
name = "mini-stim"
namespace = "mini-stim-dev"
root = "."
data_dir = ".tmp/sidecar"

[[sidecars]]
name = "server"
command = "cargo"
args = ["run", "--quiet", "-p", "mini-stim-server-cell", "--"]
cwd = "."
mode = "dev"

[sidecars.ready]
role = "server"
timeout_secs = 120

[[sidecars]]
name = "client"
command = "cargo"
args = ["run", "--quiet", "-p", "mini-stim-client-cell", "--"]
cwd = "."
mode = "dev"

[[sidecars.inherits_env]]
name = "MINI_STIM_SERVER_URL"
from = "server.endpoint"

[sidecars.ready]
role = "client"
timeout_secs = 120
